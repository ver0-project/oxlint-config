name: 'CI'

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 'Check (node ${{ matrix.node }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['lts', 'latest']
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 'Setup Vite+'
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: ${{ matrix.node }}
          cache: true

      - name: 'Install dependencies'
        run: vp install

      - name: 'Check'
        run: vp check

      - name: 'Test'
        run: vp test

  dependabot-merge:
    name: 'Dependabot automerge'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    needs: ['check']
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    steps:
      - uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3.15.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
