name: 'CI'

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 'Check (node ${{ matrix.node }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['lts', 'latest']
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Setup Vite+'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node }}
          cache: true

      - name: 'Install dependencies'
        run: vp install

      - name: 'Check'
        run: vp check

      - name: 'Test'
        run: vp test --passWithNoTests

  dependabot-merge:
    name: 'Dependabot automerge'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    needs: ['check']
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  semantic-release:
    name: 'Release'
    runs-on: ubuntu-latest
    needs: ['check']
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      new-release-published: ${{ steps.release.outputs.new-release-published }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          ref: 'master'
      - name: 'Setup Vite+'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true

      - name: 'Install dependencies'
        run: vp install

      - name: 'Release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: vp exec semantic-release
